# Render(render.com) 배포 설정 — SQLite 파일을 보관할 디스크가 필요합니다(유료 인스턴스).
services:
  - type: web
    name: kkukkeonseon-graph-lab
    runtime: node
    plan: starter
    buildCommand: "echo 의존성 없음"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/graph-lab.sqlite
      - key: TEACHER_SIGNUP_CODE
        generateValue: true
    disk:
      name: graph-lab-data
      mountPath: /var/data
      sizeGB: 1
